# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# Database Configuration (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/secureshare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# File Upload Configuration
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=./uploads

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1
app.jwt.expiration-ms=86400000

# ==========================================
# AES Encryption
# ==========================================
app.aes.secret-key=MySecretKey12345

# ==========================================
# Frontend CORS Origin
# ==========================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ==========================================
# Logging
# ==========================================
logging.level.com.secureshare=INFO
logging.level.org.springframework.security=WARN